cart(){const L=cl();if(!L.length)return `<div class="w"><div class="ph"><h1>Panier</h1></div><div class="em">${ic('cart')}<h3>Votre panier est vide</h3><a class="btn bp" href="#boutique">Découvrir nos produits</a></div></div>`;return `<div class="w"><div class="ph"><h1>Panier</h1></div><div class="cart"><section>${L.map(({p,q})=>`<div class="cr"><img src="${esc(img(p))}" alt="" width="72" height="72"><div><a href="#produit-${p.id}" style="font-weight:700;text-decoration:none;overflow-wrap:anywhere">${esc(p.name)}</a><div class="mu n" style="font-size:.88rem">${m(p.price)} l’unité</div><div class="ct"><div class="qt"><button data-q="${p.id}" data-d="-1" aria-label="Diminuer">${ic('minus')}</button><output>${q}</output><button data-q="${p.id}" data-d="1" aria-label="Augmenter" ${q>=mx(p)?'disabled':''}>${ic('plus')}</button></div><button class="ib" style="color:var(--tx)" data-rm="${p.id}" aria-label="Supprimer ${esc(p.name)}">${ic('trash')}</button></div></div><b class="n">${m(p.price*q)}</b></div>`).join('')}</section><aside class="sm"><h2 style="font-size:1.2rem">Récapitulatif</h2><dl>${L.map(({p,q})=>`<div><dt class="mu">${q} × ${esc(p.name)}</dt><dd class="n">${m(p.price*q)}</dd></div>`).join('')}<div class="tot"><dt>Total</dt><dd class="n">${m(tot())}</dd></div></dl><div class="fd"><label for="nm">Votre nom <span class="mu">(facultatif)</span></label><input class="inp" id="nm" autocomplete="name" maxlength="80" value="${esc(ls.get('name',''))}"></div><button class="btn wa" id="co">${ic('wa')}Commander via WhatsApp</button><p class="note">Le message contiendra votre nom, les produits, quantités, prix et le total.</p></aside></div></div>`},
favs(){const L=act(P).filter(p=>fav.includes(p.id));return `<div class="w"><div class="ph"><h1>Mes favoris</h1><p>Gardés sur cet appareil.</p></div>${L.length?`<div class="g c4" style="padding-bottom:2.5rem">${L.map(card).join('')}</div>`:`<div class="em">${ic('heart')}<h3>Aucun favori</h3><a class="btn bp" href="#boutique">Parcourir la boutique</a></div>`}</div>`},
about(){return `<div class="w"><div class="ph"><h1>À propos de LENS SERVICES</h1><p>Une boutique moderne qui rapproche technologie, mode et services digitaux de ceux qui en ont besoin.</p></div><div class="vl"><div><h3>${ic('arr')}Notre mission</h3><p>Rendre l’achat d’électronique, d’accessoires, de vêtements et de services digitaux simple, transparent et accessible : choisir en ligne, commander en un message.</p></div><div><h3>${ic('search')}Notre vision</h3><p>Devenir la référence locale du commerce connecté, où le sérieux se mesure à la qualité du service.</p></div><div><h3>${ic('ok')}Confiance</h3><p>Prix affichés clairement, commande confirmée avec vous avant toute livraison.</p></div><div><h3>${ic('wa')}Proximité</h3><p>Nous échangeons sur WhatsApp, là où vous êtes déjà, avec des réponses rapides.</p></div><div><h3>${ic('box')}Clarté</h3><p>Un catalogue simple, des descriptions honnêtes, aucune surprise.</p></div><div><h3>${ic('plus')}Exigence</h3><p>Des produits utiles et des services soignés, du téléphone au logo de votre entreprise.</p></div></div><div style="padding-block:2.5rem"><div class="cta"><h2>Parlons de votre projet</h2><p>Un produit à trouver, un logo ou un site à créer ? Écrivez-nous.</p><a class="btn bg" href="#contact">Nous contacter</a></div></div></div>`},
contact(){return `<div class="w"><div class="ph"><h1>Contact</h1><p>Le plus rapide : WhatsApp.</p></div><div class="cn"><div class="li"><a href="https://wa.me/${cfg.wa}" target="_blank" rel="noopener">${ic('wa')}<span>WhatsApp<br><span class="mu">+${esc(cfg.wa)}</span></span></a><a href="mailto:${esc(cfg.email)}">${ic('mail')}<span>E-mail<br><span class="mu">${esc(cfg.email)}</span></span></a><a>${ic('box')}<span>Adresse<br><span class="mu">${esc(cfg.addr)}</span></span></a></div><form class="pn2" id="cf"><h2 style="font-size:1.3rem">Envoyer un message</h2><div class="fd"><label for="cn1">Nom</label><input class="inp" id="cn1" required maxlength="80" value="${esc(ls.get('name',''))}"></div><div class="fd"><label for="cm">Message</label><textarea class="inp" id="cm" required maxlength="1000"></textarea></div><button class="btn bp" style="justify-self:start">${ic('wa')}Envoyer sur WhatsApp</button><p class="note">Votre message s’ouvre dans WhatsApp, prêt à envoyer.</p></form></div></div>`},
adm(){if(!admin)return `<div class="w"><div class="em">${ic('user')}<h3>Espace réservé</h3><p>Ouvrez cette page avec le compte propriétaire pour gérer la boutique.</p></div></div>`;if(!db)return `<div class="w"><div class="em"><h3>Base de données indisponible</h3></div></div>`;const sales=orders.filter(o=>o.status==='confirmée'||o.status==='livrée').reduce((s,o)=>s+o.total,0);return `<div class="w" style="padding-block:1.5rem 3rem"><h1 style="font-size:1.7rem;margin-bottom:1rem">Administration</h1><div class="st"><div><b>${P.length}</b><span>Produits</span></div><div><b>${orders.length}</b><span>Commandes</span></div><div><b>${orders.filter(o=>o.status==='nouvelle').length}</b><span>Nouvelles</span></div><div><b class="n">${m(sales)}</b><span>Ventes confirmées</span></div></div>
${dbEmpty?`<div class="pn2" style="margin-bottom:1.2rem"><b>Le catalogue n’est pas encore enregistré dans la base.</b><p class="mu">Enregistrez les produits d’exemple pour pouvoir les modifier.</p><button class="btn bp" id="seed" style="justify-self:start">Enregistrer le catalogue</button></div>`:''}
<div class="sh"><h2 style="font-size:1.3rem">Produits</h2><button class="btn bp bs" id="np">${ic('plus')}Nouveau produit</button></div><div id="ef"></div><div class="tw" style="margin-bottom:1.5rem"><table><thead><tr><th>Produit</th><th>Prix</th><th>Stock</th><th></th></tr></thead><tbody>${P.map(p=>`<tr><td><b>${esc(p.name)}</b><br><span class="mu">${esc(cn(p.cat))}${p.on===0?' · masqué':''}</span></td><td class="n">${m(p.price)}</td><td>${p.svc?'Service':p.stock}</td><td style="white-space:nowrap"><button class="btn bo bs" data-ed="${p.id}">Modifier</button> <button class="btn bd bs" data-dl="${p.id}" aria-label="Supprimer ${esc(p.name)}">${ic('trash')}</button></td></tr>`).join('')}</tbody></table></div>
<div class="sh"><h2 style="font-size:1.3rem">Commandes</h2></div>${orders.length?`<div class="tw" style="margin-bottom:1.5rem"><table><thead><tr><th>Commande</th><th>Articles</th><th>Total</th><th>Statut</th></tr></thead><tbody>${orders.map(o=>`<tr><td><b class="n">${esc(o.ref)}</b><br><span class="mu">${esc(o.name||'Anonyme')} · ${new Date(o.t).toLocaleDateString('fr-FR')}</span></td><td>${(o.items||[]).map(i=>`<div>${i.q} × ${esc(i.n)}</div>`).join('')}</td><td class="n">${m(o.total)}</td><td><select class="inp" data-os="${esc(o.ref)}" aria-label="Statut ${esc(o.ref)}" style="min-height:40px">${['nouvelle','confirmée','livrée','annulée'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`:`<p class="mu" style="margin-bottom:1.5rem">Aucune commande enregistrée pour le moment.</p>`}
<form class="pn2" id="sf" style="max-width:560px"><h2 style="font-size:1.2rem">Réglages</h2><div class="fd"><label for="swa">Numéro WhatsApp des commandes</label><input class="inp" id="swa" inputmode="numeric" value="${esc(cfg.wa)}"><span class="note">Indicatif pays + numéro, chiffres uniquement.</span></div><div class="fd"><label for="sem">E-mail</label><input class="inp" id="sem" type="email" value="${esc(cfg.email)}"></div><div class="fd"><label for="sad">Adresse</label><input class="inp" id="sad" value="${esc(cfg.addr)}"></div><p class="er" id="se"></p><button class="btn bp" style="justify-self:start">Enregistrer</button></form></div>`}};
function form(p){p=p||{name:'',cat:'tel',price:'',old:'',stock:0,desc:'',feat:0,svc:0,on:1,img:''};const n=!p.id;$('#ef').innerHTML=`<form class="pn2" id="pf" style="margin-bottom:1.2rem"><div class="fd"><label for="f1">Nom</label><input class="inp" id="f1" required maxlength="120" value="${esc(p.name)}"></div><div class="fd"><label for="f2">Catégorie</label><select class="inp" id="f2">${CATS.map(c=>`<option value="${c[0]}" ${p.cat===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select></div><div class="fd"><label for="f3">Prix (${cfg.cur})</label><input class="inp" id="f3" type="number" min="0" required value="${p.price}"></div><div class="fd"><label for="f4">Ancien prix (promotion, facultatif)</label><input class="inp" id="f4" type="number" min="0" value="${p.old||''}"></div><div class="fd"><label for="f5">Stock</label><input class="inp" id="f5" type="number" min="0" value="${p.stock}"></div><div class="fd"><label for="f6">Description</label><textarea class="inp" id="f6" maxlength="1500">${esc(p.desc)}</textarea></div><div class="fd"><label for="f7">Photo</label><input class="inp" id="f7" type="file" accept="image/*"><span class="note" id="f8">${p.img?'Photo enregistrée. Choisissez un fichier pour la remplacer.':'Sans photo, une image par défaut est affichée.'}</span></div><label><input type="checkbox" id="f9" ${p.feat?'checked':''}> Produit populaire</label><label><input type="checkbox" id="fa" ${p.svc?'checked':''}> Service (sans stock)</label><label><input type="checkbox" id="fb" ${p.on!==0?'checked':''}> Visible dans la boutique</label><div class="row"><button class="btn bp">${n?'Créer':'Enregistrer'}</button><button type="button" class="btn bo" id="fc">Annuler</button></div></form>`;let url=p.img||'';$('#f7').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const a=await claude.use('assets');if(!a)throw 0;const r=await a.upload(f);url=r.url;$('#f8').textContent='Photo envoyée.'}catch{toast('Envoi de la photo impossible',1)}};$('#fc').onclick=()=>$('#ef').innerHTML='';$('#pf').onsubmit=async e=>{e.preventDefault();const id=p.id||'p'+Date.now().toString(36),o={name:$('#f1').value.trim(),cat:$('#f2').value,price:Math.max(0,+$('#f3').value||0),old:+$('#f4').value||0,stock:Math.max(0,+$('#f5').value||0),desc:$('#f6').value.trim(),feat:$('#f9').checked?1:0,svc:$('#fa').checked?1:0,on:$('#fb').checked?1:0,img:url};try{await db.doc('products/'+id).set(o);toast('Produit enregistré');$('#ef').innerHTML=''}catch{toast('Enregistrement refusé',1)}}}
function route(){const h=(location.hash||'#').slice(1),r=h.startsWith('produit-')?'produit':h,a=$('#app');chrome(h.startsWith('produit-')?'produit':h);a.innerHTML=h===''?V.home():h==='boutique'?V.shop():h.startsWith('produit-')?V.prod(h.slice(8)):h==='panier'?V.cart():h==='favoris'?V.favs():h==='apropos'?V.about():h==='contact'?V.contact():h==='admin'?V.adm():V.home();if(h==='boutique'){V.fill();$('#so').value=sort}if(h.startsWith('produit-')){let n=1;const p=gp(h.slice(8));$('#mn')&&($('#mn').onclick=()=>{n=Math.max(1,n-1);$('#qv').textContent=n},$('#pl').onclick=()=>{n=Math.min(mx(p),n+1);$('#qv').textContent=n});$('#pa')&&($('#pa').onclick=()=>add(p.id,n),$('#pw').onclick=async()=>{const r=await order([{p,q:n}],ls.get('name',''));if(r)toast('Commande '+r.ref+' envoyée sur WhatsApp')})}if(h==='admin'&&admin){$('#np').onclick=()=>form();$('#seed')&&($('#seed').onclick=async()=>{try{for(const p of P0){const{id,...d}=p;await db.doc('products/'+id).set(d)}toast('Catalogue enregistré')}catch{toast('Enregistrement refusé',1)}});$('#sf').onsubmit=async e=>{e.preventDefault();const w=$('#swa').value.replace(/\D/g,'');if(w.length<8||w.length>15)return $('#se').textContent='Numéro WhatsApp invalide';$('#se').textContent='';try{await db.doc('settings/main').set({wa:w,email:$('#sem').value.trim(),addr:$('#sad').value.trim(),cur:cfg.cur});toast('Réglages enregistrés')}catch{toast('Enregistrement refusé',1)}}}if(h==='contact')$('#cf').onsubmit=e=>{e.preventDefault();ls.set('name',$('#cn1').value);window.open('https://wa.me/'+cfg.wa+'?text='+encodeURIComponent('Bonjour LENS SERVICES, je suis '+$('#cn1').value+'.\n\n'+$('#cm').value),'_blank')}}
document.addEventListener('click',async e=>{const t=e.target,g=s=>t.closest(s);let x;if(x=g('[data-add]'))return add(x.dataset.add);if(x=g('[data-fav]')){const id=x.dataset.fav;fav=fav.includes(id)?fav.filter(i=>i!==id):fav.concat(id);save();return location.hash.startsWith('#favoris')?route():document.querySelectorAll(`[data-fav="${id}"]`).forEach(b=>b.setAttribute('aria-pressed',fav.includes(id)))}if(x=g('[data-c]')){cat=x.dataset.c;document.querySelectorAll('#ch .chip').forEach(b=>b.setAttribute('aria-pressed',b===x));return V.fill()}if(x=g('[data-cat]')){cat=x.dataset.cat}if(x=g('[data-q]')){const l=cart.find(i=>i.id===x.dataset.q);l.q+=+x.dataset.d;if(l.q<1)cart=cart.filter(i=>i!==l);else l.q=Math.min(l.q,mx(gp(l.id)));save();return route()}if(x=g('[data-rm]')){cart=cart.filter(i=>i.id!==x.dataset.rm);save();return route()}if(g('#co')){const nm=$('#nm').value.trim();ls.set('name',nm);const L=cl(),r=await order(L,nm);if(r){cart=[];save();$('#app').innerHTML=`<div class="w" style="text-align:center;display:grid;gap:1rem;justify-items:center;padding-block:4rem"><h1 style="font-size:1.7rem">Commande ${esc(r.ref)} préparée</h1><p class="mu" style="max-width:44ch">WhatsApp s’est ouvert avec votre message. <b>Envoyez-le</b> pour que nous traitions votre commande.</p><a class="btn wa" href="${esc(r.url)}" target="_blank" rel="noopener">${ic('wa')}Rouvrir WhatsApp</a><a class="btn bo" href="#boutique">Continuer mes achats</a></div>`;chrome('panier')}return}if(x=g('[data-ed]'))return form(gp(x.dataset.ed));if(x=g('[data-dl]')){const p=gp(x.dataset.dl);if(confirm('Supprimer « '+p.name+' » ?'))try{await db.doc('products/'+p.id).delete();P=P.filter(i=>i.id!==p.id);route();toast('Produit supprimé')}catch{toast('Suppression refusée',1)}}});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;V.fill()}});document.addEventListener('change',async e=>{if(e.target.id==='so'){sort=e.target.value;V.fill()}const r=e.target.dataset?.os;if(r)try{await db.doc('orders/'+r).update({status:e.target.value});toast('Statut mis à jour')}catch{toast('Modification refusée',1)}});
$('#thm').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;ls.set('theme',t)};$('#srch').onclick=()=>{location.hash='boutique';setTimeout(()=>$('#q')?.focus(),50)};
addEventListener('hashchange',()=>{route();scrollTo(0,0)});route();
(async()=>{try{const c=window.claude;if(!c)return;db=await c.use('db');const u=await c.use('user');admin=u?await u.canEdit():false;if(db){db.collection('products').onSnapshot(s=>{dbEmpty=s.empty;if(!s.empty)P=s.docs.map(d=>({id:d.id,...d.data()}));route()},()=>{});db.doc('settings/main').onSnapshot(s=>{if(s.exists){cfg={...cfg,...s.data()};route()}},()=>{});if(admin)db.collection('orders').onSnapshot(s=>{orders=s.docs.map(d=>d.data()).sort((a,b)=>b.t-a.t);if(location.hash==='#admin'&&!document.querySelector('#pf'))route()},()=>{})}route()}catch{}})();
</script></body></html>
